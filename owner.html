<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>VertMex - Espace propriétaire</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root { --green-deep:#123a1c; --green:#2f7d32; --green-bright:#66bd63; --cream:#f4f0e8; --ink:#18301d; --muted:#66706a; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'DM Sans', sans-serif; background: var(--cream); color: var(--ink); min-height: 100vh; padding: 2rem; }
  main { max-width: 900px; margin: 0 auto; }
  .brand { font-family: 'Playfair Display', serif; font-size: 2rem; font-weight: 900; color: var(--green-deep); margin-bottom: 1.5rem; }
  .brand span { color: var(--green-bright); }
  .panel { background: #fff; border: 1px solid rgba(45,90,45,0.14); border-radius: 10px; padding: 1.5rem; box-shadow: 0 18px 44px rgba(18,58,28,0.08); }
  h1 { font-family: 'Playfair Display', serif; font-size: clamp(2rem, 5vw, 3.5rem); line-height: 1; color: var(--green-deep); margin-bottom: 0.85rem; }
  .lead { color: var(--muted); line-height: 1.65; max-width: 720px; margin-bottom: 1.5rem; }
  form { display: grid; gap: 1rem; }
  .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1rem; }
  label { display: grid; gap: 0.42rem; color: var(--green-deep); font-weight: 800; font-size: 0.88rem; }
  input, textarea, select { width: 100%; min-height: 48px; border: 1px solid rgba(45,90,45,0.24); border-radius: 8px; padding: 0.78rem 0.85rem; font: inherit; color: var(--ink); background: #fff; }
  textarea { min-height: 110px; resize: vertical; }
  input[type="file"] { padding: 0.68rem; background: #f9fbf8; }
  .hint { color: var(--muted); font-size: 0.78rem; line-height: 1.5; }
  .preview { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1rem; }
  .preview figure { min-height: 220px; border: 1px dashed rgba(45,90,45,0.24); border-radius: 8px; background: #f9fbf8; overflow: hidden; position: relative; display: flex; align-items: center; justify-content: center; color: var(--muted); }
  .preview img { width: 100%; height: 100%; min-height: 220px; object-fit: cover; display: none; }
  .preview figcaption { position: absolute; left: 0.7rem; bottom: 0.7rem; background: rgba(18,58,28,0.82); color: #fff; border-radius: 100px; padding: 0.25rem 0.62rem; font-size: 0.72rem; font-weight: 800; }
  button { min-height: 52px; border: 0; border-radius: 8px; background: var(--green); color: #fff; font-weight: 900; font-size: 1rem; cursor: pointer; }
  button:disabled { opacity: 0.55; cursor: wait; }
  .status { min-height: 24px; color: var(--muted); font-weight: 700; }
  .status.ok { color: var(--green); }
  .status.err { color: #a83232; }
  .setup { margin-top: 1rem; color: var(--muted); font-size: 0.82rem; line-height: 1.65; }
  code { background: #edf4ed; border-radius: 5px; padding: 0.1rem 0.28rem; color: var(--green-deep); }
  @media (max-width: 720px) {
    body { padding: 1rem; }
    .grid, .preview { grid-template-columns: 1fr; }
    .panel { padding: 1.1rem; }
  }
</style>
</head>
<body>
<main>
  <div class="brand">Vert<span>Mex</span></div>
  <section class="panel">
    <h1>Espace propriétaire</h1>
    <p class="lead">Ajoutez un projet avant / après au portfolio. Les photos seront sauvegardées dans le dépôt GitHub, puis Vercel redéploiera le site automatiquement.</p>

    <form id="ownerForm">
      <div class="grid">
        <label>Mot de passe propriétaire
          <input name="password" type="password" autocomplete="current-password" required>
        </label>
        <label>Type de projet
          <select name="category">
            <option>Avant / après</option>
            <option>Plate-bande</option>
            <option>Tourbe</option>
            <option>Haies</option>
            <option>Pavé-uni</option>
            <option>Muret</option>
            <option>Entretien</option>
          </select>
        </label>
      </div>

      <div class="grid">
        <label>Titre du projet
          <input name="title" type="text" placeholder="Ex. Cour arrière à Saint-Rémi" required>
        </label>
        <label>Ville
          <input name="city" type="text" placeholder="Ex. Saint-Rémi">
        </label>
      </div>

      <label>Description courte
        <textarea name="description" placeholder="Ex. Nettoyage, taille de haies et finition propre du terrain."></textarea>
      </label>

      <div class="grid">
        <label>Photo avant
          <input id="beforeFile" name="before" type="file" accept="image/jpeg,image/png,image/webp" required>
          <span class="hint">Photo claire, idéalement horizontale. Le fichier sera compressé avant l’envoi.</span>
        </label>
        <label>Photo après
          <input id="afterFile" name="after" type="file" accept="image/jpeg,image/png,image/webp" required>
          <span class="hint">Même angle si possible. Ça rend le avant / après beaucoup plus fort.</span>
        </label>
      </div>

      <div class="preview">
        <figure><img id="beforePreview" alt="Aperçu avant"><figcaption>Avant</figcaption></figure>
        <figure><img id="afterPreview" alt="Aperçu après"><figcaption>Après</figcaption></figure>
      </div>

      <div class="status" id="status" aria-live="polite"></div>
      <button id="submitBtn" type="submit">Publier ce projet</button>
    </form>

    <p class="setup">Configuration requise dans Vercel : <code>OWNER_UPLOAD_PASSWORD</code>, <code>GITHUB_TOKEN</code>, et optionnellement <code>GITHUB_REPO</code> / <code>GITHUB_BRANCH</code>.</p>
  </section>
</main>

<script>
  const form = document.getElementById('ownerForm');
  const statusEl = document.getElementById('status');
  const submitBtn = document.getElementById('submitBtn');

  async function fileToJpegDataUrl(file, previewId) {
    const bitmap = await createImageBitmap(file);
    const max = 1600;
    let { width, height } = bitmap;
    if (width > height && width > max) {
      height = Math.round(height * max / width);
      width = max;
    } else if (height > max) {
      width = Math.round(width * max / height);
      height = max;
    }

    const canvas = document.createElement('canvas');
    canvas.width = width;
    canvas.height = height;
    canvas.getContext('2d').drawImage(bitmap, 0, 0, width, height);
    const dataUrl = canvas.toDataURL('image/jpeg', 0.84);

    const preview = document.getElementById(previewId);
    preview.src = dataUrl;
    preview.style.display = 'block';
    return dataUrl;
  }

  let beforeImage = '';
  let afterImage = '';

  document.getElementById('beforeFile').addEventListener('change', async (event) => {
    if (event.target.files[0]) beforeImage = await fileToJpegDataUrl(event.target.files[0], 'beforePreview');
  });

  document.getElementById('afterFile').addEventListener('change', async (event) => {
    if (event.target.files[0]) afterImage = await fileToJpegDataUrl(event.target.files[0], 'afterPreview');
  });

  form.addEventListener('submit', async (event) => {
    event.preventDefault();
    statusEl.className = 'status';
    statusEl.textContent = 'Envoi en cours...';
    submitBtn.disabled = true;

    const data = new FormData(form);
    try {
      if (!beforeImage || !afterImage) throw new Error('Ajoutez les deux photos avant de publier.');

      const response = await fetch('/api/owner-projects', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          password: data.get('password'),
          title: data.get('title'),
          category: data.get('category'),
          city: data.get('city'),
          description: data.get('description'),
          beforeImage,
          afterImage,
        }),
      });
      const result = await response.json();
      if (!response.ok) throw new Error(result.error || 'Impossible de publier le projet.');

      statusEl.className = 'status ok';
      statusEl.textContent = 'Projet publié. Vercel va redéployer le site automatiquement.';
      form.reset();
      beforeImage = '';
      afterImage = '';
      document.getElementById('beforePreview').style.display = 'none';
      document.getElementById('afterPreview').style.display = 'none';
    } catch (error) {
      statusEl.className = 'status err';
      statusEl.textContent = error.message;
    } finally {
      submitBtn.disabled = false;
    }
  });
</script>
</body>
</html>
